<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toggle Wars App</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px">
  <h1 id="headline">Loading...</h1>
  <button id="cta">Sign Up Free</button>
  <p id="debug" style="color:gray;font-size:12px"></p>

  <script src="https://cdn.jsdelivr.net/npm/@flagsmith/flagsmith@12.4.0/index.js"></script>
  <script>
    const A = "Build your startup faster";
    const B = "Launch your idea in 24 hours";
    const debug = document.getElementById("debug");

    let uid = localStorage.getItem("uid");
    if (!uid) {
      uid = "user_" + Math.random().toString(36).slice(2);
      localStorage.setItem("uid", uid);
    }

    if (typeof flagsmith === "undefined") {
      document.getElementById("headline").textContent = A;
      debug.textContent = "SDK failed to load";
    } else {
      flagsmith.init({
        environmentID: "hTUke6CjBWEV5owZULZKoM",
        identity: uid,
        enableEvents: true
      }).then(() => {
        const flag = flagsmith.getExperimentFlag("hero_headline");
        const isB = flag && flag.variant === "Variant_1";
        document.getElementById("headline").textContent = isB ? B : A;
        debug.textContent = "variant: " + (flag ? flag.variant : "none");
      }).catch(e => {
        document.getElementById("headline").textContent = A;
        debug.textContent = "Error: " + e;
      });
    }

    document.getElementById("cta").onclick = () => {
      if (typeof flagsmith !== "undefined") flagsmith.trackEvent("signup_click");
      alert("Signed up!");
    };
  </script>
</body>
</html>
